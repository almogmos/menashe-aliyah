<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light">
<title>לוח העלייה, כנפי שחר</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0F2B5B; --blue:#1D5BA6; --sky-deep:#2F9FD8; --sky:#CFE6F6; --sky-2:#BFEAF7; --hero:#EDF5FC;
  --bg:#F6F9FC; --surface:#FFFFFF; --surface2:#F3F7FC; --ink:#13223F; --muted:#58667E; --line:#E2E9F2;
  --tint:#E8F2FC; --save:#1D7A55; --save-soft:#E3F3EC; --over:#C2412F; --over-soft:#FBE9E6; --warm:#B4561A; --warm-soft:#FFF4E5;
  --sans:"Assistant","Segoe UI","Arial Hebrew",Arial,sans-serif;
  --numf:"Barlow Condensed","Assistant","Segoe UI",Arial,sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{background:#fff;scroll-padding-top:120px;-webkit-text-size-adjust:100%}
html,body{overflow-x:clip}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,select{font:inherit;color:inherit}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}
.wrap{max-width:1160px;margin:0 auto;padding:0 20px 64px}

/* app bar */
.appbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.97);-webkit-backdrop-filter:saturate(1.4) blur(10px);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.appbar .in{max-width:1160px;margin:0 auto;padding:10px 20px 0;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:10px;color:var(--navy);min-width:0}
.brand svg{width:36px;height:30px;color:var(--sky-deep);flex:none}
.brand b{font-weight:800;font-size:18px;display:block;line-height:1.2}
.brand small{display:block;font-size:13px;color:var(--blue);font-weight:600;line-height:1.2}
.spacer{flex:1}
.ja{height:34px;width:auto;display:block}
nav.tabs{max-width:1160px;margin:0 auto;padding:8px 14px 10px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:none;border:0;color:var(--muted);padding:7px 16px;border-radius:999px;font-weight:700;font-size:16px;cursor:pointer;white-space:nowrap}
nav.tabs button:hover{background:var(--surface2);color:var(--ink)}
nav.tabs button[aria-selected="true"]{background:var(--tint);color:var(--blue)}
@media (max-width:640px){.ja{height:26px}.brand b{font-size:16px}nav.tabs button{font-size:15px;padding:7px 12px}}

/* hero */
.band{margin-inline:calc(50% - 50vw);padding-inline:calc(50vw - 50%);background:var(--hero);border-bottom:1px solid var(--line)}
.hero{padding:26px 0 26px;display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center}
.hero svg.logo{width:118px;height:119px;display:block}
.hero h1{color:var(--navy);font-weight:800;font-size:28px;line-height:1.15;margin:0 0 4px}
.hero .lead{color:var(--muted);margin:0 0 14px;font-size:15.5px}
.figs{display:flex;gap:26px;flex-wrap:wrap}
.figs div{display:flex;flex-direction:column}
.figs b{font-family:var(--numf);font-weight:700;font-size:40px;line-height:1;color:var(--navy)}
.figs span{font-size:14px;color:var(--muted);font-weight:600}
@media (max-width:640px){.hero{grid-template-columns:1fr;gap:12px}.hero svg.logo{width:78px;height:79px}.hero h1{font-size:24px}.figs{gap:18px}.figs b{font-size:34px}}

.page-head{padding:24px 0 14px}
.page-head h1{margin:0;font-size:24px;font-weight:800;color:var(--navy)}
.page-head p{margin:2px 0 0;color:var(--muted);font-size:15px}
.grid{display:grid;gap:18px}
.grid>*{min-width:0}
.g2{grid-template-columns:1fr 1fr}.gs{grid-template-columns:1.5fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
@media (max-width:900px){.g3{grid-template-columns:1fr 1fr}}
@media (max-width:760px){.g2,.gs,.g3{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px 22px}
.panel h2{font-size:18px;margin:0 0 2px;font-weight:700;color:var(--navy)}
.panel .sub{color:var(--muted);font-size:14px;margin:0 0 14px}
@media (max-width:600px){.wrap{padding:0 14px 56px}.panel{padding:16px}}
.note{font-size:13.5px;color:var(--muted)}
.empty{padding:28px 10px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--navy);font-size:17px;margin-bottom:4px}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:18px;background:var(--surface);margin:0 0 18px}
.kpis>div{padding:14px 18px;border-inline-start:1px solid var(--line)}
.kpis>div:first-child{border-inline-start:0}
.kpis label{display:block;color:var(--muted);font-size:14px}
.kpis .v{font-family:var(--numf);font-size:30px;font-weight:600;color:var(--navy);line-height:1.15}
@media (max-width:760px){.kpis{grid-template-columns:1fr 1fr}.kpis>div:nth-child(3){border-inline-start:0}.kpis>div:nth-child(n+3){border-top:1px solid var(--line)}}

/* home */
.cds{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:22px 0 20px}
@media (max-width:900px){.cds{grid-template-columns:1fr 1fr}}
.cd{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:2px;text-align:start;cursor:pointer;min-width:0}
.cd:hover{border-color:#B7CCE2}
.cd .k{font-size:13px;color:var(--muted);font-weight:600}
.cd .d{font-family:var(--numf);font-weight:700;font-size:38px;line-height:1;color:var(--navy);margin-top:4px}
.cd .d small{font-family:var(--sans);font-size:15px;font-weight:700;color:var(--muted);margin-inline-start:4px}
.cd .t{font-weight:700;color:var(--ink);line-height:1.3;margin-top:4px}
.cd .s{font-size:13.5px;color:var(--muted)}
.cd.soon{border-color:#E8833A;background:#FFF9F2}
.cd.soon .d{color:#B4561A}
.dcard h2{display:flex;align-items:baseline;gap:10px}
.dcard h2 .num{font-family:var(--numf);font-size:28px;color:var(--navy)}
.dcard h2 small{font-size:14px;color:var(--muted);font-weight:600}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
.pill{font-size:13px;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--tint);color:var(--blue)}
.pill.warm{background:var(--warm-soft);color:var(--warm)}
.pill.ok{background:var(--save-soft);color:var(--save)}
.hl{background:var(--surface2);border-radius:12px;padding:9px 12px;font-size:15px;margin:0 0 10px}
.hl b{color:var(--navy)}
.wk{list-style:none;margin:0;padding:0}
.wk li{display:grid;grid-template-columns:62px 1fr;gap:12px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.wk li:first-child{border-top:0}
.wk .dd{font-family:var(--numf);font-weight:700;font-size:22px;color:var(--blue);line-height:1.1}
.wk .dd small{display:block;font-family:var(--sans);font-size:12.5px;color:var(--muted);font-weight:600}
.wk .x b{display:block;font-size:15px;color:var(--navy)}
.wk .x span{font-size:14px;color:var(--muted)}
.linkbtn{background:none;border:0;color:var(--blue);font-weight:700;cursor:pointer;padding:6px 0;font-size:15px}

/* timeline */
.ev{display:grid;grid-template-columns:74px 1fr;gap:12px;padding:10px 10px;border-radius:12px;border-inline-start:4px solid transparent;margin-bottom:4px}
.ev .tm{font-weight:800;font-variant-numeric:tabular-nums;color:var(--navy);line-height:1.25}
.ev .tm small{display:block;font-weight:600;font-size:13px;color:var(--muted)}
.ev .tt{font-weight:700;line-height:1.35}
.ev .own{display:flex;flex-direction:column;gap:2px;margin-top:5px;font-size:14.5px;font-weight:700;color:var(--navy)}.ev .own span::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--sky-deep);margin-inline-end:7px;vertical-align:2px}
.ev .nt{font-size:14.5px;color:var(--muted);margin-top:2px}
.tag{display:inline-block;font-size:12px;font-weight:800;padding:0 8px;border-radius:999px;margin-inline-end:6px;vertical-align:2px;white-space:nowrap}
.k-flight{background:#F1F3FE;border-inline-start-color:#5B6CD9}.k-flight .tag{background:#5B6CD9;color:#fff}
.k-olim{background:#EAF6F1;border-inline-start-color:#2C9A7A}.k-olim .tag{background:#1F7E62;color:#fff}
.k-partner{background:#FFF7EC;border-inline-start-color:#E8833A}.k-partner .tag{background:#B4561A;color:#fff}
.k-program{background:var(--surface2);border-inline-start-color:var(--sky-deep)}.k-program .tag{background:var(--blue);color:#fff}
.k-welcome{background:#FDF1F4;border-inline-start-color:#C2416B}.k-welcome .tag{background:#A8325A;color:#fff}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13.5px;color:var(--muted);margin:2px 0 12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}

/* day strip */
.daystrip{display:flex;gap:6px;overflow-x:auto;padding:16px 2px 10px;scrollbar-width:thin}
.day{flex:none;width:56px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:6px 0 6px;display:flex;flex-direction:column;align-items:center;gap:0;cursor:pointer;color:var(--ink)}
.day span{font-size:12.5px;color:var(--muted);font-weight:700}
.day b{font-family:var(--numf);font-size:19px;font-weight:600;line-height:1.2}
.day i{width:5px;height:5px;border-radius:50%;margin-top:2px;background:transparent}
.day i.on{background:var(--sky-deep)}
.day.sat span{color:var(--blue)}
.day.today{border-color:var(--sky-deep);border-width:2px}
.day[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.day[aria-pressed="true"] span{color:#CFE6F6}
.day[aria-pressed="true"] i.on{background:#fff}
.dayhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:6px 0 4px}
.dayhead h2{margin:0;font-size:26px;font-weight:800;color:var(--navy)}
.dayhead .num{font-family:var(--numf);font-size:30px;font-weight:700;color:var(--navy)}
.daynav{display:flex;gap:8px;margin-inline-start:auto}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 15px;cursor:pointer;font-weight:700;white-space:nowrap;color:var(--navy);font-size:14.5px}
.btn:hover{background:var(--surface2)}
.btn:disabled{opacity:.45;cursor:default}
.where{list-style:none;margin:0;padding:0}
.where li{padding:9px 0;border-top:1px solid var(--line)}
.where li:first-child{border-top:0}
.where b{color:var(--navy);display:block}
.where span{font-size:14.5px;color:var(--ink)}
.where .c{font-family:var(--numf);font-weight:700;font-size:22px;color:var(--blue);float:inline-end}
.nights{display:flex;align-items:flex-end;gap:4px;height:150px;padding-top:18px;overflow-x:auto}
.nights button{flex:1;min-width:30px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;background:none;border:0;cursor:pointer;padding:0}
.nights .bar{width:100%;max-width:34px;background:var(--sky-deep);border-radius:6px 6px 0 0;min-height:2px}
.nights .v{font-family:var(--numf);font-weight:700;font-size:14px;color:var(--navy)}
.nights .d{font-size:11.5px;color:var(--muted);margin-top:4px;white-space:nowrap}
.nights button.sel .bar{background:var(--navy)}
.places{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.place{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--surface)}
.place b{color:var(--navy);display:block}
.place small{display:block;color:var(--blue);font-weight:700;font-size:13px}
.place p{margin:4px 0 0;font-size:14px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:15px}
th{font-weight:700;color:var(--muted);text-align:start;padding:8px;border-bottom:1px solid var(--line);font-size:13.5px;white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:end}
.tbl-wrap{overflow-x:auto}

/* olim */
.segtabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 13px;font-size:14px;font-weight:700;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.filters{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:0 0 16px}
@media (max-width:900px){.filters{grid-template-columns:repeat(3,1fr)}}
@media (max-width:520px){.filters{grid-template-columns:1fr 1fr}}
.filters label{display:block;font-size:13px;color:var(--muted);font-weight:700;margin-bottom:3px}
select{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 10px;width:100%}
.fbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:-6px 0 14px;font-size:14px;color:var(--muted)}
.tkflights{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:0 0 8px}
@media (max-width:1000px){.tkflights{grid-template-columns:repeat(3,1fr)}}
@media (max-width:560px){.tkflights{grid-template-columns:1fr 1fr}}
.tkfl{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:11px 12px;text-align:start;cursor:pointer;display:flex;flex-direction:column;gap:1px}
.tkfl.on{border-color:var(--navy);box-shadow:0 0 0 1px var(--navy)}
.tkfl .t{font-weight:800;color:var(--navy);font-size:14.5px}
.tkfl .k{font-size:12.5px;color:var(--muted)}
.tkfl b{font-family:var(--numf);font-size:32px;font-weight:700;color:var(--navy);line-height:1.05}
.tkfl .s{font-size:12.5px;color:var(--muted)}
.tkfl .vz{font-size:12.5px;color:var(--save);font-weight:700;margin-top:2px}
.tkfl .mix{display:flex;height:6px;border-radius:3px;overflow:hidden;margin-top:6px;background:var(--line)}
.tkbars{display:flex;flex-direction:column;gap:7px}
.tkbar{display:grid;grid-template-columns:minmax(90px,38%) 1fr auto;gap:10px;align-items:center;background:none;border:0;padding:3px 4px;border-radius:8px;cursor:pointer;text-align:start;width:100%}
.tkbar:hover{background:var(--surface2)}
.tkbar.on{background:var(--tint)}
.tkbar .l{font-size:14.5px;line-height:1.25}
.tkbar .b{height:9px;background:var(--surface2);border-radius:5px;overflow:hidden}
.tkbar .b i{display:block;height:100%;background:var(--sky-deep);border-radius:5px}
.tkbar .c{font-size:13px;color:var(--muted);white-space:nowrap}
.tkbar .c b{font-family:var(--numf);font-size:18px;color:var(--navy);margin-inline-end:4px}
.pyr{display:flex;flex-direction:column;gap:5px}
.pyr-h,.pyr-r{display:grid;grid-template-columns:1fr 92px 1fr;gap:8px;align-items:center}
.pyr-h{font-size:13px;color:var(--muted);font-weight:700}
.pyr-h span:last-child{text-align:end}
.pyr-r{background:none;border:0;padding:2px 0;cursor:pointer;border-radius:6px}
.pyr-r.on{background:var(--tint)}
.pyr-r .lab{text-align:center;font-size:13px;color:var(--ink)}
.pyr-r .m,.pyr-r .f{display:flex;align-items:center;gap:6px}
.pyr-r .m{flex-direction:row-reverse;justify-content:flex-start}
.pyr-r i{height:14px;border-radius:3px;display:block}
.pyr-r .m i{background:var(--navy)}.pyr-r .f i{background:var(--sky-deep)}
.pyr-r b{font-family:var(--numf);font-size:15px;color:var(--navy);min-width:22px}
table.pv td.pvc{text-align:end;font-family:var(--numf);font-size:17px;font-weight:600}
table.pv th.rh{color:var(--ink);font-weight:700;font-size:14.5px;white-space:normal}
table.pv tr.tot td,table.pv tr.tot th{border-top:2px solid var(--navy);font-weight:800;color:var(--navy)}
.prog{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden;min-width:80px;margin-top:5px}
.prog i{display:block;height:100%;background:var(--save)}

/* ceremonies */
.wcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 20px;margin-bottom:14px}
.whead{display:flex;gap:16px;align-items:flex-start;margin-bottom:8px}
.whead .dt{min-width:72px}
.whead .dt small{display:block;font-size:13px;color:var(--muted);font-weight:700}
.whead .dt b{font-family:var(--numf);font-size:32px;font-weight:700;color:var(--navy);line-height:1}
.whead h3{margin:0;font-size:18px;color:var(--navy)}
.wf{display:grid;grid-template-columns:150px 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.wf .l{color:var(--muted);font-weight:700}
.miss{display:inline-block;background:var(--over-soft);color:var(--over);font-weight:800;font-size:12.5px;border-radius:999px;padding:0 9px}
@media (max-width:560px){.wf{grid-template-columns:1fr;gap:2px}}

footer{border-top:1px solid var(--line);background:#fff;padding:20px 0 calc(20px + env(safe-area-inset-bottom,0px))}
footer .in{max-width:1160px;margin:0 auto;padding:0 20px;display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13.5px;flex-wrap:wrap}
footer svg{width:28px;height:24px;color:var(--sky-deep)}
</style>
</head>
<body>
<!--__SYMBOLS__-->
<header class="appbar">
  <div class="in">
    <div class="brand"><svg aria-hidden="true"><use href="#dove"/></svg><span><b>לוח העלייה</b><small>מבצע כנפי שחר, נובמבר 2026</small></span></div>
    <span class="spacer"></span>
    <img class="ja" src="__JA__" alt="הסוכנות היהודית">
  </div>
  <nav class="tabs" role="tablist" aria-label="אזורים">
    <button role="tab" data-area="home" aria-selected="true">עמוד ראשי</button>
    <button role="tab" data-area="schedule" aria-selected="false">לוח זמנים</button>
    <button role="tab" data-area="olim" aria-selected="false">עולים</button>
    <button role="tab" data-area="welcomes" aria-selected="false">טקסים</button>
  </nav>
</header>
<main class="wrap" id="main"></main>
<footer><div class="in"><svg aria-hidden="true"><use href="#dove"/></svg><span id="foot"></span></div></footer>

<script>
const D = /*__DATA__*/null;
const S = { area: 'home', day: null, tkView: 'overview', F: {}, pv: { rows: 'sg', cols: 'pop' } };
const $ = (q, r) => (r || document).querySelector(q);
const $$ = (q, r) => [...(r || document).querySelectorAll(q)];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const plain = n => Number(n || 0).toLocaleString('he-IL');
const WD = ['ראשון', 'שני', 'שלישי', 'רביעי', 'חמישי', 'שישי', 'שבת'];
const WL = ['א׳', 'ב׳', 'ג׳', 'ד׳', 'ה׳', 'ו׳', 'ש׳'];
const dobj = iso => new Date(iso + 'T12:00:00Z');
const wday = iso => dobj(iso).getUTCDay();
const dshort = iso => { if (!iso) return ''; const p = iso.split('-'); return Number(p[2]) + '.' + Number(p[1]); };
const addDays = (iso, n) => { const d = dobj(iso); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const diffDays = (a, b) => Math.round((dobj(b) - dobj(a)) / 864e5);
const TODAY = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Jerusalem', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
const DAYS = []; for (let d = D.start; d <= D.end; d = addDays(d, 1)) DAYS.push(d);

/* ---------- derived ---------- */
function dayEvents(d) {
  const L = D.events.filter(e => e.date === d && e.kind !== 'headline').map(e => Object.assign({}, e));
  (D.welcomes || []).filter(w => w.date === d).forEach(w => L.push({ date: d, time: w.time, kind: 'welcome', text: 'קבלת פנים בנתב״ג: ' + w.title, note: (w.olim ? w.olim + ' עולים. ' : '') + (((w.fields || []).find(f => f.l === 'טיסה') || {}).v || '') }));
  return L.sort((a, b) => (a.time || '00:00') < (b.time || '00:00') ? -1 : (a.time || '00:00') > (b.time || '00:00') ? 1 : 0);
}
const heads = d => D.events.filter(e => e.date === d && e.kind === 'headline');
const olimNight = d => (D.groups || []).filter(o => o.from <= d && d < o.to).reduce((s, o) => s + (o.count || 0), 0);
function whoWhere(d) {

}
const flightsTo = () => ((D.olim && D.olim.flights) || []);
function flightCount(f) { return cubeRows().filter(r => r[0] === f).reduce((s, r) => s + r[11], 0); }

  try { history.replaceState(null, '', '#' + area + (area === 'schedule' && S.day ? '/' + S.day : '')); } catch (e) {}
  render(); window.scrollTo({ top: 0 });
}
function render() {

  ({ home: renderHome, schedule: renderSchedule, olim: renderOlim, welcomes: renderWelcomes }[S.area] || renderHome)(m);

/* ---------- home ---------- */
function milestones() {
  const M = [];
  const firstDelhi = (D.groups || []).reduce((a, o) => !a || o.from < a.from ? o : a, null);
  if (firstDelhi) M.push({ date: firstDelhi.from, k: 'עולים מגיעים לדלהי', t: 'קבוצה ' + firstDelhi.id + ', ' + firstDelhi.count + ' עולים', s: firstDelhi.origin });
  flightsTo().forEach(f => { const n = flightCount(f.f); M.push({ date: f.date, k: 'טיסה ' + f.f + ' לישראל', t: plain(n) + ' עולים, ' + (f.carrier || ''), s: f.escort ? 'מלווה: ' + f.escort : '' }); });
  (D.welcomes || []).forEach(w => M.push({ date: w.date, k: 'קבלת פנים בנתב״ג', t: w.title, s: w.time ? 'נחיתה ' + w.time : '' }));
  const upcoming = M.filter(x => x.date >= TODAY).sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
  const seen = new Set(); return upcoming.filter(x => { const k = x.date + x.k; if (seen.has(k)) return false; seen.add(k); return true; }).slice(0, 4);
}
function untilLabel(d) {

  return '<div class="d"><span class="num">' + n + '</span><small>ימים</small></div>';
}
function dayCard(d, title) {

  const key = E.filter(e => e.kind !== 'program');
  const prog = E.filter(e => e.kind === 'program');
  let h = '<div class="panel dcard"><h2>' + title + ' <span class="num">' + dshort(d) + '</span><small>יום ' + WD[wday(d)] + '</small></h2><div class="pills">' +
    (night ? '<span class="pill">' + plain(night) + ' עולים בדלהי הלילה</span>' : '') + '</div>';
  H.forEach(x => h += '<div class="hl"><b>' + esc(SRC[x.source] || '') + ':</b> ' + esc(x.text) + '</div>');
  const li = E2 => E2.map(e => evRow(e)).join('');

}
function noteHTML(n) {

  const parts = n.replace(/^אחראים:\s*/, '').split(/(?<=\.)\s+/);
  const own = [], rest = [];
  parts.forEach((p, k) => (k === 0 || /^(ליווי לשדה|קבלה בדלהי|שינוע לשדה|הסעה ממאניפור)/.test(p) || /עד המלון בדלהי/.test(p) ? own : rest).push(p.replace(/\.$/, '')));
  return '<div class="own">' + own.map(x => '<span>' + esc(x) + '</span>').join('') + '</div>' + (rest.length ? '<div class="nt">' + esc(rest.join('. ') + '.') + '</div>' : '');
}

  }

const cubeRows = () => (D.olim && D.olim.cube) || [];

    h += '<div class="panel" style="margin-top:6px"><h2>אירועים עם העולים והשותפים בדלהי</h2><p class="sub">משלחות של קרן היסוד ושל קשרי תורמים, כולל הטקס לקראת העלייה</p>';
    let last = '';
    C.forEach(e => { if (e.date !== last) { h += '<p style="margin:14px 0 6px;font-weight:800;color:var(--navy)">יום ' + WD[wday(e.date)] + ', <span class="num">' + dshort(e.date) + '</span></p>'; last = e.date; } h += evRow(e); });
    h += '</div>';
  }
  m.innerHTML = h; bindGo(m);
}

/* ---------- boot ---------- */
(function boot() {
  const hs = (location.hash || '').slice(1).split('/');
  if (['home', 'schedule', 'olim', 'welcomes'].indexOf(hs[0]) >= 0) { S.area = hs[0]; if (hs[1] && DAYS.indexOf(hs[1]) >= 0) S.day = hs[1]; }
  $$('nav.tabs button').forEach(x => x.setAttribute('aria-selected', String(x.dataset.area === S.area)));
  const b = new Date(D.built);
  $('#foot').textContent = 'מבצע כנפי שחר, גל שני. עודכן לאחרונה ' + b.toLocaleString('he-IL', { timeZone: 'Asia/Jerusalem', day: 'numeric', month: 'numeric', hour: '2-digit', minute: '2-digit' }) + ', מתוך מערכת הניהול של הפרויקט.';
  render();
})();
</script>
